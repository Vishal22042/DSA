name: Update LeetCode README

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.github/**'
  schedule:
    - cron: '0 0 * * *'   # Runs every day at midnight UTC — refreshes stats widgets
  workflow_dispatch:        # Allows manual trigger from GitHub Actions tab

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Update Script
        run: node .github/scripts/update_readme.js

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: auto-update LeetCode problems table in README [skip ci]"
          file_pattern: 'README.md'
